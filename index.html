<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой сайт</title>

    <style>
        body{
            background:#1f2937;
            color:white;
            font-family:Arial;
            text-align:center;
            margin-top:120px;
        }

        h1{
            font-size:60px;
        }

        p{
            font-size:24px;
        }

        button{
            padding:15px 35px;
            font-size:22px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            background:#3b82f6;
            color:white;
        }

        button:hover{
            background:#2563eb;
        }
    </style>
</head>
<body>

<h1>Привет!</h1>

<p>Меня зовут Диас!</p>

<button onclick="alert('Ты нажал кнопку!')">
Нажми меня
</button>

</body>
</html>
